<h1>AWS To-Do List</h1>

<input type="text" placeholder="Enter a task" [(ngModel)]="task" />
<button (click)="addTask()">Add Task</button>

@for(task of taskList; track task.id) {
  <ul class="task-item">
    <li>{{ task.id }}</li>
    <li>{{ task.name }}</li>
    <li>
      <button (click)="deleteTask(task.id)">Delete</button>
    </li>
  </ul>
}

<router-outlet />
